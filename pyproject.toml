[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivux"
version = "0.1.0"
description = "Google Drive sob demanda para Linux, com interface simples, usando rclone."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.48"]

[project.scripts]
drivux = "drivux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
