[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivux"
version = "1.0.0"
description = "On-demand Google Drive for Linux with a simple interface, powered by rclone."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.48"]

[project.scripts]
drivux = "drivux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
